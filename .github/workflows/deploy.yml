name: Deploy

# **Manual only, deliberately.** Not `on: push`. During an event a merge to
# main must never be able to restart the server underneath 200 people; a
# deploy is something a person decides to do.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to confirm"
        required: true
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check the confirmation
        if: inputs.confirm != 'DEPLOY'
        run: |
          echo "::error::Type DEPLOY in the confirm box to run this workflow."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release number lives in exactly one place: client/pubspec.yaml.
      # `flutter build web` copies it into build/web/version.json by itself,
      # and the --dart-define below puts the same string in the drawer, so a
      # phone on the floor and a curl from a laptop agree on what is running.
      - name: Read the release version
        id: version
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' client/pubspec.yaml | head -1 | tr -d '\r')
          test -n "$version" || { echo "::error::no version: line in client/pubspec.yaml"; exit 1; }
          echo "about to build $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Runs BEFORE the build, which takes minutes — a deploy that is going to
      # be refused should be refused in seconds.
      #
      # The live site is the source of truth for "what is deployed", not a file
      # in the repo and not a tag: version.json is written by the build that is
      # actually serving, and Caddy sends it with Cache-Control: no-cache
      # precisely so this read cannot be stale.
      #
      # Shipping the same number twice is not itself an outage. It is worse
      # than one: two different bundles both calling themselves 1.0.0+2, and
      # no way left to tell from a phone which of them somebody is looking at.
      - name: Refuse to redeploy the version that is already live
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          live=$(curl -fsS --max-time 10 "https://${SITE_DOMAIN}/version.json" || true)
          if [ -z "$live" ]; then
            echo "::warning::could not read https://${SITE_DOMAIN}/version.json — first deploy, or the site is down. Bump check skipped."
            exit 0
          fi
          # version.json splits the pubspec string in two, so put it back:
          # {"version":"1.0.0","build_number":"2"} -> 1.0.0+2
          live_version=$(printf '%s' "$live" | jq -r '.version + (if (.build_number // "") == "" then "" else "+" + .build_number end)')
          echo "live: $live_version    new: $NEW_VERSION"
          if [ "$live_version" = "$NEW_VERSION" ]; then
            echo "::error::$NEW_VERSION is already live. Bump the version: line in client/pubspec.yaml before deploying."
            exit 1
          fi

      # Keep in sync with .fvmrc and ci.yml.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.0

      - name: Install melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      # SERVER_URL is a COMPILE-TIME constant. There is no runtime override on
      # Flutter web, so this flag is the only moment the deployed bundle can
      # learn where its server is.
      - name: Build the client
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          test -n "$SITE_DOMAIN" || { echo "::error::repository variable SITE_DOMAIN is not set"; exit 1; }
          cd client
          flutter build web --release \
            --dart-define=SERVER_URL=wss://${SITE_DOMAIN}/ws \
            --dart-define=APP_VERSION=${APP_VERSION}

      # The failure this guards against is silent: forgetting the flag above
      # still BUILDS, and ships a bundle that dials ws://localhost:8080/ws
      # forever. The app loads, the art renders, and nobody can join.
      #
      # This asserts the real host is PRESENT rather than that localhost is
      # absent. `localhost:8080` is in every bundle regardless: it is
      # `defaultServerUrl`, the fallback branch of `resolveServerUri`, guarded
      # by a runtime `Uri.tryParse` that dart2js cannot fold away. Testing for
      # its absence fails every build, including the good ones.
      - name: Refuse to ship a bundle that is not pointing at SITE_DOMAIN
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          count=$(grep -c "wss://${SITE_DOMAIN}/ws" client/build/web/main.dart.js || true)
          echo "wss://${SITE_DOMAIN}/ws occurrences: $count"
          if [ "$count" = "0" ]; then
            echo "::error::built bundle does not contain wss://${SITE_DOMAIN}/ws — the --dart-define did not apply"
            exit 1
          fi

      - name: Set up the SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Make sure the server is ready to receive
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'command -v rsync >/dev/null 2>&1 || { sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq rsync; }
             mkdir -p /opt/virtual-meetup/deploy/web'

      # --delete is safe here and only here: deploy/web is build output and
      # nothing on the server writes to it. Stale hashed assets from the
      # previous build would otherwise accumulate forever.
      - name: Upload the client bundle
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            client/build/web/ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/virtual-meetup/deploy/web/"

      # **No --delete on these.** deploy/ on the server holds .env and data/,
      # which exist only there. A --delete here would erase the admin token
      # and the ban list.
      - name: Upload the server sources
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -az -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            --exclude '.dart_tool' --exclude 'build' \
            --exclude '*.log' --exclude 'bans.json' --exclude 'config.json' \
            protocol server "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/virtual-meetup/"
          rsync -az -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            --exclude '.env' --exclude 'data' --exclude 'web' \
            deploy/ "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/virtual-meetup/deploy/"

      # Only the relay is rebuilt. Caddy keeps running, which means the
      # certificate is untouched and the static bundle is served throughout.
      - name: Rebuild and restart the relay
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'cd /opt/virtual-meetup/deploy && docker compose up -d --build relay'

      - name: Verify the deployment answers
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "https://${SITE_DOMAIN}/health"; then echo; exit 0; fi
            sleep 5
          done
          echo "::error::/health did not answer after the deploy"
          exit 1

      # /health proves the relay came back. This proves the BUNDLE changed —
      # a different failure entirely, and the quiet one: the rsync could have
      # gone to the wrong path, or the relay could have restarted on new code
      # while every phone kept loading the old web build, and /health would
      # answer cheerfully through all of it.
      - name: Verify the live version is the one just built
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          for i in $(seq 1 5); do
            live=$(curl -fsS --max-time 10 "https://${SITE_DOMAIN}/version.json" || true)
            live_version=$(printf '%s' "$live" | jq -r '.version + (if (.build_number // "") == "" then "" else "+" + .build_number end)' 2>/dev/null || true)
            if [ "$live_version" = "$NEW_VERSION" ]; then
              echo "live version is $live_version"
              exit 0
            fi
            sleep 3
          done
          echo "::error::the site is serving '$live_version', expected '$NEW_VERSION' — the new bundle did not land"
          exit 1

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/id_deploy
