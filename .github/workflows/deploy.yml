name: Deploy

# **Manual only, deliberately.** Not `on: push`. During an event a merge to
# main must never be able to restart the server underneath 200 people; a
# deploy is something a person decides to do.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to confirm"
        required: true
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check the confirmation
        if: inputs.confirm != 'DEPLOY'
        run: |
          echo "::error::Type DEPLOY in the confirm box to run this workflow."
          exit 1

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Keep in sync with .fvmrc and ci.yml.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.0

      - name: Install melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      # SERVER_URL is a COMPILE-TIME constant. There is no runtime override on
      # Flutter web, so this flag is the only moment the deployed bundle can
      # learn where its server is.
      - name: Build the client
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          test -n "$SITE_DOMAIN" || { echo "::error::repository variable SITE_DOMAIN is not set"; exit 1; }
          cd client
          flutter build web --release \
            --dart-define=SERVER_URL=wss://${SITE_DOMAIN}/ws

      # The failure this guards against is silent: forgetting the flag above
      # still BUILDS, and ships a bundle that dials ws://localhost:8080/ws
      # forever. The app loads, the art renders, and nobody can join.
      #
      # This asserts the real host is PRESENT rather than that localhost is
      # absent. `localhost:8080` is in every bundle regardless: it is
      # `defaultServerUrl`, the fallback branch of `resolveServerUri`, guarded
      # by a runtime `Uri.tryParse` that dart2js cannot fold away. Testing for
      # its absence fails every build, including the good ones.
      - name: Refuse to ship a bundle that is not pointing at SITE_DOMAIN
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          count=$(grep -c "wss://${SITE_DOMAIN}/ws" client/build/web/main.dart.js || true)
          echo "wss://${SITE_DOMAIN}/ws occurrences: $count"
          if [ "$count" = "0" ]; then
            echo "::error::built bundle does not contain wss://${SITE_DOMAIN}/ws — the --dart-define did not apply"
            exit 1
          fi

      - name: Set up the SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Make sure the server is ready to receive
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'command -v rsync >/dev/null 2>&1 || { sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq rsync; }
             mkdir -p /opt/virtual-meetup/deploy/web'

      # --delete is safe here and only here: deploy/web is build output and
      # nothing on the server writes to it. Stale hashed assets from the
      # previous build would otherwise accumulate forever.
      - name: Upload the client bundle
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            client/build/web/ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/virtual-meetup/deploy/web/"

      # **No --delete on these.** deploy/ on the server holds .env and data/,
      # which exist only there. A --delete here would erase the admin token
      # and the ban list.
      - name: Upload the server sources
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -az -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            --exclude '.dart_tool' --exclude 'build' \
            --exclude '*.log' --exclude 'bans.json' --exclude 'config.json' \
            protocol server "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/virtual-meetup/"
          rsync -az -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            --exclude '.env' --exclude 'data' --exclude 'web' \
            deploy/ "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/virtual-meetup/deploy/"

      # Only the relay is rebuilt. Caddy keeps running, which means the
      # certificate is untouched and the static bundle is served throughout.
      - name: Rebuild and restart the relay
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'cd /opt/virtual-meetup/deploy && docker compose up -d --build relay'

      - name: Verify the deployment answers
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "https://${SITE_DOMAIN}/health"; then echo; exit 0; fi
            sleep 5
          done
          echo "::error::/health did not answer after the deploy"
          exit 1

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/id_deploy
