name: Bug report
description: Something in the client or the relay does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the server with ...
        2. Open the client on ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Which part
      options:
        - client (Flutter web)
        - server (relay)
        - protocol
        - load tester
        - deploy
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser / device / OS
      placeholder: e.g. Chrome 140 on Android 15
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The version shown in the app drawer, or the commit you built from.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Browser console or server output. Remove any ADMIN_TOKEN or session ids first.
      render: text
