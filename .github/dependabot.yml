# Weekly dependency PRs. Free for public repositories.
#
# Never merge one of these during an event week: a dependency bump is a
# deploy like any other, and deploys are manual for a reason (see deploy.yml).
version: 2
updates:
  # Every action in .github/workflows is pinned to a commit SHA. Dependabot
  # bumps the SHA and the trailing `# vX.Y.Z` comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Pub workspace: one pubspec.lock at the root covers every package.
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # 11.0 switches the formatter to `trailing_commas: automate` and adds
      # `unnecessary_type_name_in_constructor`: ~290 rewrites plus 82
      # reformatted files. A style migration, not a bump. Revisit after
      # FlutterCon India (21 Nov 2026). Patch and minor updates still come.
      - dependency-name: very_good_analysis
        update-types: ["version-update:semver-major"]
