<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    The Virtual Meetup mark: two beans meeting on the brand blue.
    Proportions follow lib/game/bean_art.dart (body 26 x 36, a dark visor
    with two eyes), so the icon is the same character people walk around as.
    Source for icons/Icon-192.png and icons/Icon-512.png.
  -->
  <rect width="512" height="512" rx="112" fill="#0553B1"/>
  <g transform="translate(0 -18)">
    <!-- floor shadows -->
    <ellipse cx="180" cy="398" rx="66" ry="16" fill="#03397A"/>
    <ellipse cx="300" cy="424" rx="90" ry="20" fill="#03397A"/>
    <!-- back bean -->
    <g transform="translate(180 392)">
      <rect x="-72" y="-200" width="144" height="200" rx="72" fill="#7ED9B6" stroke="#0B1A22" stroke-width="12"/>
      <rect x="-38" y="-160" width="62" height="44" rx="20" fill="#12212B"/>
      <circle cx="-22" cy="-138" r="8" fill="#F4FAFF"/>
      <circle cx="6" cy="-138" r="8" fill="#F4FAFF"/>
    </g>
    <!-- front bean -->
    <g transform="translate(300 418)">
      <rect x="-98" y="-272" width="196" height="272" rx="98" fill="#F2C14E" stroke="#0B1A22" stroke-width="12"/>
      <rect x="-76" y="-218" width="112" height="60" rx="27" fill="#12212B"/>
      <circle cx="-50" cy="-188" r="11" fill="#F4FAFF"/>
      <circle cx="-8" cy="-188" r="11" fill="#F4FAFF"/>
      <!-- a little shine so it reads as a toy, not a sticker -->
      <rect x="52" y="-236" width="16" height="70" rx="8" fill="#FFF3C9" opacity="0.8"/>
    </g>
  </g>
</svg>
