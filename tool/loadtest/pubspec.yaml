name: loadtest
description: >-
  Bot load-tester — opens N websocket clients that wander the world, so the
  relay can be measured under conference-sized load instead of guessed at.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.13.0

resolution: workspace
dependencies:
  args: ^2.7.0
  protocol: ^1.0.0
  web_socket_channel: ^3.0.3
dev_dependencies:
  server: ^1.0.0
  shelf: ^1.4.2
  test: ^1.31.1
  very_good_analysis: ^10.3.0
